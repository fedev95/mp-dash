server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # Firebase Auth (Google popup) needs *.firebaseapp.com and accounts.google.com frames.
  # If you use a custom authDomain, add it to frame-src.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.googleusercontent.com; font-src 'self' data:; connect-src 'self' https://*.googleapis.com; frame-src https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Allows the Google sign-in popup to talk back to the app.
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Hashed build files never change, so they can be cached for a long time.
  location ~* \.(?:js|css|woff2?|ttf|eot|svg)$ {
    expires 1y;
    try_files $uri =404;
  }

  # SPA fallback: unknown paths are Angular routes.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
