services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - claude_config:/root/.claude
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  node_modules:
  claude_config:
