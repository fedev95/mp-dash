<aside
  class="h-full flex flex-col bg-white dark:bg-surface-900 border-r border-surface-200 dark:border-surface-700 overflow-x-hidden transition-[width] duration-300 ease-in-out"
  [class.w-64]="!collapsed()"
  [class.w-16]="collapsed()"
>
  <div class="flex items-center p-2" [class.justify-start]="!collapsed()" [class.justify-center]="collapsed()">
    <button
      type="button"
      (click)="toggle()"
      class="flex items-center justify-center w-8 h-8 shrink-0 rounded-lg text-surface-500 dark:text-surface-400 hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors"
      [attr.aria-label]="collapsed() ? 'Expandir menú' : 'Contraer menú'"
    >
      <i
        class="pi flex items-center justify-center"
        [class.pi-angle-right]="collapsed()"
        [class.pi-angle-left]="!collapsed()"
      ></i>
    </button>
  </div>

  <nav class="flex flex-col gap-1 px-2 pb-4">
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="bg-primary-50 text-primary-600 dark:bg-primary-500/10 dark:text-primary-300"
        [routerLinkActiveOptions]="{ exact: true }"
        [title]="collapsed() ? link.label : ''"
        [class.justify-center]="collapsed()"
        [class.gap-3]="!collapsed()"
        class="flex items-center px-3 py-2 rounded-lg text-surface-600 dark:text-surface-300 hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors"
      >
        <i [class]="link.icon" class="w-5 shrink-0 text-center"></i>
        <span
          class="text-sm font-medium whitespace-nowrap overflow-hidden transition-all duration-300"
          [class.opacity-0]="collapsed()"
          [class.w-0]="collapsed()"
          >{{ link.label }}</span
        >
      </a>
    }
  </nav>
</aside>
