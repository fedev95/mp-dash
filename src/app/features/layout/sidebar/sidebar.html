<aside class="h-full w-full bg-white dark:bg-surface-900 border-r border-surface-200 dark:border-surface-700 p-4">
  <nav class="flex flex-col gap-1">
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="bg-primary-50 text-primary-600 dark:bg-primary-500/10 dark:text-primary-300"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 px-3 py-2 rounded-lg text-surface-600 dark:text-surface-300 hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors"
      >
        <i [class]="link.icon"></i>
        <span class="text-sm font-medium">{{ link.label }}</span>
      </a>
    }
  </nav>
</aside>
