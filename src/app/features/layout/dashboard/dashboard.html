<div class="flex flex-col gap-6">
  <h1 class="text-2xl font-semibold text-surface-900 dark:text-surface-0">Dashboard</h1>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    @for (stat of stats; track stat.label) {
      <p-card>
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-lg bg-primary-50 dark:bg-primary-500/10 flex items-center justify-center">
            <i [class]="stat.icon" class="text-primary-500 text-xl"></i>
          </div>
          <div>
            <p class="text-sm text-surface-500">{{ stat.label }}</p>
            <p class="text-xl font-semibold text-surface-900 dark:text-surface-0">{{ stat.value }}</p>
          </div>
        </div>
      </p-card>
    }
  </div>
</div>
