<p-dialog
  header="Eliminar cuenta"
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [closable]="!deleting()"
  [dismissableMask]="!deleting()"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '28rem' }"
  (onHide)="reset()"
>
  <p class="text-sm text-surface-600 dark:text-surface-300">
    Se eliminarán tu cuenta y todos tus datos: resúmenes, categorías, reglas y notas. Esta acción no
    se puede deshacer.
  </p>
  <p class="text-sm text-surface-600 dark:text-surface-300 mt-3">
    Para confirmar, escribí
    <span class="font-semibold text-surface-900 dark:text-surface-0">{{ confirmationWord }}</span>.
  </p>

  <input
    pInputText
    type="text"
    autocomplete="off"
    aria-label="Confirmación"
    [placeholder]="confirmationWord"
    class="w-full mt-4"
    [value]="inputValue()"
    (input)="onInput($event)"
    [disabled]="deleting()"
  />

  @if (errorMessage()) {
    <p-message severity="error" [text]="errorMessage()!" styleClass="w-full mt-3" />
  }

  <div class="flex justify-end gap-2 mt-5">
    <p-button
      label="Cancelar"
      severity="secondary"
      [outlined]="true"
      [disabled]="deleting()"
      (onClick)="visible.set(false)"
    />
    <p-button
      label="Eliminar cuenta"
      severity="danger"
      [loading]="deleting()"
      [disabled]="!isValid()"
      (onClick)="confirm()"
    />
  </div>
</p-dialog>
