<div class="min-h-screen flex items-center justify-center bg-surface-50 dark:bg-surface-950 p-4">
  <div class="w-full max-w-sm bg-white dark:bg-surface-900 rounded-xl shadow-md p-8 flex flex-col gap-4">
    <div class="text-center mb-2">
      <h1 class="text-2xl font-semibold text-surface-900 dark:text-surface-0">Iniciar sesión</h1>
      <p class="text-surface-500 text-sm">Ingresá a tu dashboard</p>
    </div>

    @if (errorMessage()) {
      <p-message severity="error" [text]="errorMessage()!" styleClass="w-full" />
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label for="email" class="text-sm font-medium text-surface-700 dark:text-surface-200">Email</label>
        <input pInputText id="email" type="email" formControlName="email" class="w-full" autocomplete="email" />
      </div>

      <div class="flex flex-col gap-1">
        <label for="password" class="text-sm font-medium text-surface-700 dark:text-surface-200">Contraseña</label>
        <p-password
          inputId="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
          autocomplete="current-password"
        />
      </div>

      <p-button type="submit" label="Entrar" [loading]="loading()" [disabled]="loading()" styleClass="w-full" />
    </form>

    <div class="flex items-center gap-2 text-surface-400 text-xs">
      <div class="flex-1 h-px bg-surface-200 dark:bg-surface-700"></div>
      o
      <div class="flex-1 h-px bg-surface-200 dark:bg-surface-700"></div>
    </div>

    <p-button
      label="Continuar con Google"
      icon="pi pi-google"
      severity="secondary"
      [outlined]="true"
      [loading]="loading()"
      [disabled]="loading()"
      styleClass="w-full"
      (onClick)="loginWithGoogle()"
    />

    <p class="text-center text-sm text-surface-500">
      ¿No tenés cuenta?
      <a routerLink="/register" class="text-primary-500 font-medium hover:underline">Registrate</a>
    </p>
  </div>
</div>
