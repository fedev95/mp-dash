name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate environment.ts with placeholder Firebase config
        run: |
          set -a
          . ./.env.example
          set +a
          sh ./scripts/generate-env.sh

      - run: npm run format:check
      - run: npm run lint
      # No sandbox: recent Ubuntu runners restrict the user namespaces Chrome's sandbox needs.
      - run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production image
        run: |
          set -a
          . ./.env.example
          set +a
          docker build --target prod \
            --build-arg FIREBASE_API_KEY --build-arg FIREBASE_AUTH_DOMAIN \
            --build-arg FIREBASE_PROJECT_ID --build-arg FIREBASE_STORAGE_BUCKET \
            --build-arg FIREBASE_MESSAGING_SENDER_ID --build-arg FIREBASE_APP_ID \
            -t mp-dash:ci .
